<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">

<html>
<head>
	<title>Phinneas Stone</title>
    <style>
        body {
            background-color: #005500;
            color: #F5D76E;
            font-size: 18pt;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

		img.logo {
			height: 200px;
			width: 200px;
		}

		.panel {
			display: inline-block;
			margin-top: 20px;
			padding: 30px 50px;
			background-color: rgba(0, 0, 0, 0.18);
			border: 1px solid rgba(245, 215, 110, 0.35);
			border-radius: 10px;
			box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
			line-height: 1.6;
		}

		.ornament {
			position: fixed;
			top: 0;
			bottom: 0;
			width: 48px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 22pt;
			letter-spacing: 6px;
			color: rgba(245, 215, 110, 0.45);
			writing-mode: vertical-rl;
			text-orientation: upright;
			user-select: none;
			pointer-events: none;
			overflow: hidden;
		}

		.ornament.left {
			left: 14px;
		}

		.ornament.right {
			right: 14px;
		}
    </style>
</head>

<body>

	<div class="ornament left">✦ ❈ ✦ ❈ ✦ ❈ ✦ ❈ ✦ ❈ ✦ ❈ ✦</div>
	<div class="ornament right">✦ ❈ ✦ ❈ ✦ ❈ ✦ ❈ ✦ ❈ ✦ ❈ ✦</div>

	<center>
        <img src="images/Seagull_Raven.png" class="logo">
        <br>
        <div class="panel">
            I can't complain but sometimes I still do.<br>
            I'll stop the world and melt with you.<br>
            I me mine. I walk the line.<br>
            I am the walrus, goo goo g'joob.
        </div>

    </center>

</body>
</html>
