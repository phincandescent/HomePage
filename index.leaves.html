<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">

<html>
<head>
	<title>Phinneas Stone</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-image: url("images/leaves-background.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #1F3B4D;
            font-size: 18pt;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

		img.logo {
			height: 200px;
			width: 200px;
		}

		.panel {
			display: inline-block;
			margin-top: 20px;
			padding: 30px 50px;
			background-color: rgba(255, 255, 255, 0.55);
			border: 1px solid rgba(31, 59, 77, 0.25);
			border-radius: 10px;
			box-shadow: 0 4px 22px rgba(31, 59, 77, 0.18);
			backdrop-filter: blur(6px);
			-webkit-backdrop-filter: blur(6px);
			line-height: 1.6;
		}
    </style>
</head>

<body>

	<center>
        <img src="images/Seagull_Raven.png" class="logo">
        <br>
        <div class="panel">
            I can't complain but sometimes I still do.<br>
            I'll stop the world and melt with you.<br>
            I me mine. I walk the line.<br>
            I am the walrus, goo goo g'joob.
        </div>

    </center>

</body>
</html>
